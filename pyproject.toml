[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nerp-forms-bot"
version = "0.1.0"
description = "Configuration-driven NERP DOJ Discord document workflow bot."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "discord.py>=2.5,<3.0",
  "pydantic>=2.10,<3.0",
  "pydantic-settings>=2.7,<3.0",
  "PyYAML>=6.0,<7.0",
  "SQLAlchemy>=2.0,<3.0",
  "aiosqlite>=0.20,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.8,<1.0",
]

[project.scripts]
nerp-forms-bot = "nerp_forms_bot.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/nerp_forms_bot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
